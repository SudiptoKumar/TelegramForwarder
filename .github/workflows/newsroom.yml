name: NewsroomHQ Rich News Aggregator

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: newsroomhq-aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python newsroom.py --check

      - name: Publish new newsroom posts
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python newsroom.py

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json skipped.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update NewsroomHQ state"
            git push
          fi
